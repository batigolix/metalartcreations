name: Security audit
# AI generated

on:
  schedule:
    - cron: '0 5 * * 1'   # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Composer audit
        run: composer audit --locked --format=plain

  npm-audit:
    runs-on: ubuntu-latest
    if: hashFiles('web/themes/custom/**/package-lock.json', 'web/themes/alpaca/package-lock.json') != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: NPM audit per theme
        run: |
          for lock in web/themes/custom/*/package-lock.json web/themes/alpaca/package-lock.json; do
            [ -f "$lock" ] || continue
            dir=$(dirname "$lock")
            echo "::group::$dir"
            (cd "$dir" && npm audit --omit=dev) || echo "::warning::$dir has advisories"
            echo "::endgroup::"
          done
