# AI generated
name: Lint
on:
  pull_request:
  push:
    branches: [main, develop, master]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache composer deps
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPCS (Drupal + DrupalPractice)
        run: |
          bin/phpcs \
            --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install,test,profile,theme,info,yml \
            --report=checkstyle \
            web/modules/custom web/themes/alpaca \
          | cs2pr

      - name: PHPStan
        run: bin/phpstan analyse --no-progress --error-format=github
